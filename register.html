<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="auth-card register-card">
        <h2>Create an Account</h2>
        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required minlength="3">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="10-digit number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Min 6 characters" minlength="6" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Re-enter password" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" placeholder="e.g. Pune" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea rows="3" placeholder="Delivery address..." required></textarea>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the Terms & Conditions</label>
            </div>

            <button type="submit" class="btn-submit">Register</button>
            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </form>
    </div>

</body>
</html>
